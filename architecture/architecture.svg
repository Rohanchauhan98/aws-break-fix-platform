<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 730" width="1220" height="730" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>AWS Break-Fix Platform architecture</title>
  <desc>Internet traffic reaches an Application Load Balancer in public subnets, which forwards to an Auto Scaling group of EC2 instances in two availability zones. Instances use an IAM role to reach S3 and a database in a private subnet. CloudTrail and CloudWatch watch the stack.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1220" height="730" rx="16" fill="#0b1220"/>

  <!-- title -->
  <text x="40" y="52" font-size="26" font-weight="700" fill="#f1f5f9">AWS Break-Fix Platform</text>
  <text x="40" y="78" font-size="14" fill="#94a3b8">Multi-AZ web stack in ap-southeast-2 (Sydney)</text>

  <!-- internet users -->
  <rect x="40" y="330" width="120" height="72" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="100" y="362" font-size="15" font-weight="600" fill="#f1f5f9" text-anchor="middle">Internet</text>
  <text x="100" y="383" font-size="12" fill="#94a3b8" text-anchor="middle">your IP only</text>

  <!-- region -->
  <rect x="190" y="100" width="1000" height="584" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="210" y="127" font-size="13" font-weight="600" fill="#94a3b8">AWS Region ap-southeast-2</text>

  <!-- VPC -->
  <rect x="210" y="144" width="640" height="520" rx="12" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="230" y="171" font-size="14" font-weight="600" fill="#cbd5e1">VPC</text>

  <!-- availability zones -->
  <rect x="230" y="186" width="290" height="458" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="540" y="186" width="290" height="458" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="250" y="208" font-size="12" fill="#94a3b8">Availability Zone A</text>
  <text x="560" y="208" font-size="12" fill="#94a3b8">Availability Zone B</text>

  <!-- public subnets -->
  <rect x="240" y="222" width="270" height="150" rx="8" fill="#0c2238" stroke="#0ea5e9" stroke-opacity="0.6" stroke-width="1.2"/>
  <rect x="550" y="222" width="270" height="150" rx="8" fill="#0c2238" stroke="#0ea5e9" stroke-opacity="0.6" stroke-width="1.2"/>
  <text x="256" y="243" font-size="12" fill="#7dd3fc">Public subnet</text>
  <text x="566" y="243" font-size="12" fill="#7dd3fc">Public subnet</text>

  <!-- ALB spanning both zones -->
  <rect x="270" y="256" width="520" height="62" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="530" y="282" font-size="15" font-weight="600" fill="#f1f5f9" text-anchor="middle">Application Load Balancer</text>
  <text x="530" y="302" font-size="12" fill="#94a3b8" text-anchor="middle">Spans both zones. Accepts your IP only</text>

  <!-- NAT gateway (lab only) -->
  <rect x="270" y="328" width="180" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="360" y="351" font-size="12" fill="#e2e8f0" text-anchor="middle">NAT gateway (lab only)</text>

  <!-- private subnets -->
  <rect x="240" y="396" width="270" height="236" rx="8" fill="#171a38" stroke="#818cf8" stroke-opacity="0.6" stroke-width="1.2"/>
  <rect x="550" y="396" width="270" height="236" rx="8" fill="#171a38" stroke="#818cf8" stroke-opacity="0.6" stroke-width="1.2"/>
  <text x="256" y="417" font-size="12" fill="#c4b5fd">Private subnet</text>
  <text x="566" y="417" font-size="12" fill="#c4b5fd">Private subnet</text>

  <!-- Auto Scaling group bracket -->
  <rect x="252" y="430" width="556" height="112" rx="12" fill="none" stroke="#818cf8" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="577" y="451" font-size="12" fill="#a5b4fc" text-anchor="middle">Auto Scaling group (min 2)</text>

  <!-- EC2 instances -->
  <rect x="268" y="462" width="226" height="64" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.8"/>
  <text x="381" y="488" font-size="15" font-weight="600" fill="#f1f5f9" text-anchor="middle">EC2 instance</text>
  <text x="381" y="508" font-size="12" fill="#94a3b8" text-anchor="middle">Accepts the load balancer only</text>

  <rect x="566" y="462" width="226" height="64" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.8"/>
  <text x="679" y="488" font-size="15" font-weight="600" fill="#f1f5f9" text-anchor="middle">EC2 instance</text>
  <text x="679" y="508" font-size="12" fill="#94a3b8" text-anchor="middle">Accepts the load balancer only</text>

  <!-- database (lab only) -->
  <rect x="268" y="562" width="226" height="54" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="381" y="585" font-size="14" font-weight="600" fill="#f1f5f9" text-anchor="middle">Database (lab only)</text>
  <text x="381" y="603" font-size="12" fill="#94a3b8" text-anchor="middle">Accepts the app servers only</text>

  <!-- supporting services -->
  <text x="880" y="208" font-size="13" font-weight="600" fill="#94a3b8">Supporting services</text>

  <rect x="880" y="222" width="290" height="72" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="1.6"/>
  <text x="1025" y="251" font-size="15" font-weight="600" fill="#f1f5f9" text-anchor="middle">CloudTrail and CloudWatch</text>
  <text x="1025" y="272" font-size="12" fill="#94a3b8" text-anchor="middle">Change and symptom alarms, emailed</text>

  <rect x="880" y="326" width="290" height="72" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="1025" y="355" font-size="15" font-weight="600" fill="#f1f5f9" text-anchor="middle">IAM instance role</text>
  <text x="1025" y="376" font-size="12" fill="#94a3b8" text-anchor="middle">Least privilege, no access keys</text>

  <rect x="880" y="458" width="290" height="72" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.6"/>
  <text x="1025" y="487" font-size="15" font-weight="600" fill="#f1f5f9" text-anchor="middle">S3 bucket</text>
  <text x="1025" y="508" font-size="12" fill="#94a3b8" text-anchor="middle">Public access blocked, read via role</text>

  <!-- arrows -->
  <path d="M160 366 H205 V287 H268" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M475 318 V459" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M679 318 V459" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M381 526 V559" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M792 494 H877" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- legend -->
  <line x1="40" y1="706" x2="76" y2="706" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="88" y="710" font-size="12" fill="#94a3b8">Traffic flow</text>
  <rect x="190" y="697" width="36" height="18" rx="5" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="238" y="710" font-size="12" fill="#94a3b8">Created only during lab sessions</text>
  <text x="1190" y="710" font-size="12" fill="#94a3b8" text-anchor="end">Lab instances ran in public subnets to avoid NAT cost</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
